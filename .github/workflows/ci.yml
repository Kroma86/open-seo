name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The repo baseline is not clean (prettier, knip and oxlint all report
      # findings on files nobody is touching), so a whole-repo gate is red on
      # every PR. Format and lint only what this change touches; type checks
      # still cover the whole repo. knip reports but does not block until its
      # baseline is cleaned.
      - name: List changed files
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          git fetch --no-tags --depth=1 origin "$base"
          git diff --name-only --diff-filter=ACMR "$base" HEAD > "$RUNNER_TEMP/changed.txt"
          echo "changed files: $(wc -l < "$RUNNER_TEMP/changed.txt")"

      - name: Prettier (changed files)
        run: xargs -a "$RUNNER_TEMP/changed.txt" -r pnpm exec prettier --check --ignore-unknown

      - name: Oxlint (changed files)
        run: grep -E '\.(ts|tsx|mjs|js|cjs)$' "$RUNNER_TEMP/changed.txt" | xargs -r pnpm exec oxlint --type-aware

      - name: Type checks
        run: pnpm exec tsc --noEmit && pnpm exec tsc --noEmit -p badseo/tsconfig.json

      - name: Knip (report only)
        continue-on-error: true
        run: pnpm exec knip

      - name: Plugin skills in sync
        run: pnpm sync-plugin-skills && test -z "$(git status --porcelain -- plugins/openseo/skills)"

      - name: Run tests
        run: pnpm run test:ci

      # Runs the leanWorkerBundle generateBundle assertion: fails if a
      # denylisted package (dataforseo-client, autumn-js, ...) re-enters the
      # worker's eager startup graph. See vite-plugin-lean-worker-bundle.ts.
      - name: Build worker (eager-bundle guard)
        run: pnpm vite build

      - name: Install website dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Run website type checks
        run: pnpm --dir web run types:check

      - name: Build website
        run: pnpm --dir web run build

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build self-host Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.selfhost
          push: false
          load: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
